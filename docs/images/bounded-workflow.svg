<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Bounded transcription workflow</title><desc id="desc">A hashed scan goes to two blind readers, strict comparison, one adjudication where needed, and a versioned result with uncertainty. Reference checks follow decisions.</desc><rect width="1200" height="720" fill="#f7f9fc"/><g font-family="Helvetica Neue,Avenir Next,Arial Nova,Arial,sans-serif" fill="#0b0f14"><text x="48" y="60" font-size="25" font-weight="700">TWO READINGS. ONE BOUNDED DECISION.</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2454ff"/></marker></defs><g fill="none" stroke="#2454ff" stroke-width="4"><path d="M225 240H290V170H345" marker-end="url(#arrow)"/><path d="M290 240V350H345" marker-end="url(#arrow)"/><path d="M560 170H635V260H680" marker-end="url(#arrow)"/><path d="M560 350H635V260"/><path d="M900 260H1037V450" marker-end="url(#arrow)"/><path d="M790 310V410H685V450" marker-end="url(#arrow)"/><path d="M920 505H850" marker-end="url(#arrow)"/><path d="M685 560V615" marker-end="url(#arrow)"/></g><g font-size="17" fill="#2454ff"><text x="805" y="382">Agreement</text><text x="1053" y="382">Dispute</text></g><g stroke="#0b0f14" stroke-width="2" fill="#ffffff"><rect x="45" y="190" width="180" height="100"/><rect x="345" y="120" width="215" height="100"/><rect x="345" y="300" width="215" height="100"/><rect x="680" y="210" width="220" height="100"/><rect x="920" y="450" width="235" height="110"/><rect x="520" y="450" width="330" height="110"/></g><g font-size="23" font-weight="700"><text x="65" y="235">Source crop</text><text x="365" y="165">Blind reader A</text><text x="365" y="345">Blind reader B</text><text x="700" y="255">Strict compare</text><text x="940" y="488">One adjudication</text><text x="540" y="490">Versioned disposition</text></g><g font-size="19"><text x="65" y="267">Identity + hash</text><text x="365" y="195">No prior answers</text><text x="365" y="375">No reference text</text><text x="700" y="285">Marks count</text><text x="940" y="525">Disputed fields only</text><text x="540" y="530">Settled / corrected / uncertain</text><text x="680" y="650">Reference check afterward</text><text x="48" y="650">Replay from retained evidence</text></g></g></svg>