<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">Two blind AI readings and one bounded model adjudication</title>
<desc id="desc">Two blind AI readers receive a hashed source crop without prior answers or reference text. Strict comparison sends agreement to a versioned disposition and disputes to one model adjudication using the source and anonymous candidates. Outcomes are settled, corrected, or uncertain. Settled means workflow-accepted, not independently human-verified. A reference check follows the decisions. Uncertain cases are retained and exported for future human review outside the automated workflow; the review interface is not yet built.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2454ff"/></marker></defs>
<rect width="1200" height="950" fill="#f7f9fc"/>
<g font-family="Helvetica Neue,Avenir Next,Arial Nova,Arial,sans-serif" fill="#0b0f14">
<text x="40" y="48" font-size="26" font-weight="700">TWO AI READINGS. ONE BOUNDED MODEL DECISION.</text>
<text x="40" y="84" font-size="15" fill="#697382" letter-spacing="1">AUTOMATED WORKFLOW</text>
<rect x="25" y="100" width="1150" height="645" fill="none" stroke="#697382" stroke-width="1.5" stroke-dasharray="7 6"/>
<g fill="none" stroke="#2454ff" stroke-width="4">
<path d="M245 320H280V195H310" marker-end="url(#arrow)"/>
<path d="M280 320V365H310" marker-end="url(#arrow)"/>
<path d="M560 195H600V310H640" marker-end="url(#arrow)"/>
<path d="M560 365H600V310"/>
<path d="M750 365V400H630V440" marker-end="url(#arrow)"/>
<path d="M860 310H1035V440" marker-end="url(#arrow)"/>
<path d="M910 505H830" marker-end="url(#arrow)"/>
<path d="M630 600V655" marker-end="url(#arrow)"/>
<path d="M830 585H995V795" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
</g>
<g fill="#2454ff" font-size="17">
<text x="654" y="390">Agreement</text><text x="1050" y="393">Dispute</text><text x="1010" y="630">Uncertain</text><text x="1010" y="653">cases only</text>
</g>
<g fill="#fff" stroke="#0b0f14" stroke-width="2">
<rect x="55" y="265" width="190" height="110"/>
<rect x="310" y="140" width="250" height="110"/>
<rect x="310" y="310" width="250" height="110"/>
<rect x="640" y="255" width="220" height="110"/>
<rect x="910" y="440" width="250" height="130"/>
<rect x="430" y="440" width="400" height="160"/>
</g>
<g font-size="23" font-weight="700">
<text x="74" y="307">Source crop</text><text x="330" y="178">Blind AI reader A</text><text x="330" y="348">Blind AI reader B</text><text x="660" y="297" font-size="21">Strict comparison</text>
<text x="930" y="479">One model</text><text x="930" y="506">adjudication</text><text x="450" y="478">Versioned disposition</text>
</g>
<g font-size="18">
<text x="74" y="340">Identity + hash</text>
<text x="330" y="208">No prior answers</text><text x="330" y="232">No reference text</text>
<text x="330" y="378">No prior answers</text><text x="330" y="402">No reference text</text>
<text x="660" y="331">Punctuation counts</text>
<text x="930" y="536" font-size="16">Source crop +</text><text x="930" y="557" font-size="16">anonymous candidates</text>
<text x="450" y="513">Settled / corrected / uncertain</text>
<text x="450" y="552" font-size="17">Settled = workflow-accepted</text><text x="450" y="578" font-size="17">Not independently human-verified</text>
</g>
<text x="630" y="685" font-size="21" text-anchor="middle">Reference check afterward</text>
<text x="630" y="715" font-size="16" text-anchor="middle">Gwulo is a cross-check, not a source for blind reads.</text>
<text x="40" y="785" font-size="15" fill="#697382" letter-spacing="1">OUTSIDE THE AUTOMATED WORKFLOW</text>
<rect x="815" y="800" width="360" height="122" fill="#fff" stroke="#697382" stroke-width="2" stroke-dasharray="7 5"/>
<text x="835" y="836" font-size="23" font-weight="700">Retained uncertain cases</text>
<text x="835" y="868" font-size="18">Export for human review</text>
<text x="835" y="897" font-size="16" fill="#697382">Review interface not yet built</text>
<text x="55" y="660" font-size="20" font-weight="700">Evidence retained.</text>
<text x="55" y="690" font-size="17">Replay saved runs offline.</text>
<text x="40" y="850" font-size="21" font-weight="700">Uncertainty stays in the record.</text>
<text x="40" y="883" font-size="18">Export is implemented; human review is a future step.</text>
</g></svg>
