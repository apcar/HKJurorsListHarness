<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">One added letter changes the transcription</title><desc id="desc">Illustration of literal Ld. changing to normalized Ltd.; comparison must preserve the distinction.</desc><rect width="1200" height="660" fill="#0b0f14"/><g font-family="Arial, sans-serif"><text x="60" y="65" fill="#b9c5d5" font-size="22" letter-spacing="3">THE SOURCE IS THE AUTHORITY</text><path d="M60 100H1140" stroke="#526070"/><text x="60" y="165" fill="#b9c5d5" font-size="23">LITERAL FORM</text><text x="660" y="165" fill="#b9c5d5" font-size="23">MODEL NORMALIZATION</text><text x="60" y="345" fill="#ffffff" font-size="170" font-weight="700">Ld.</text><text x="660" y="345" fill="#ffffff" font-size="170" font-weight="700">L<tspan fill="#ff5349">t</tspan>d.</text><path d="M440 280H590l-25-25m25 25-25 25" fill="none" stroke="#ff5349" stroke-width="7"/><text x="60" y="440" fill="#ffffff" font-size="28">Plausible is not the same as faithful.</text><text x="60" y="490" fill="#b9c5d5" font-size="24">A checker can introduce the error it was meant to catch.</text><path d="M60 545H1140" stroke="#526070"/><text x="60" y="600" fill="#b9c5d5" font-size="19">EXPLANATORY ILLUSTRATION · NOT A SCAN OR A PERFORMANCE BENCHMARK</text></g></svg>